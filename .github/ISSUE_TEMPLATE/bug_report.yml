name: Bug report
description: Report a defect in DFTK
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I run `dftk run ...` with ..., it returns ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Run `dftk run ... --params '...'`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DFTK version
      description: Output of `dftk --version`
      placeholder: "2.1.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`
      placeholder: "3.12.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / Windows 11 / macOS 14"
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Installed extras
      description: Which optional extras are installed? (email / ssh / windows / all)
      placeholder: "pip install \"dftk[all]\""
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the JSON `Observation` or error output. Redact any sensitive paths/values.
      render: json
  - type: checkboxes
    id: safety
    attributes:
      label: Safety acknowledgement
      options:
        - label: I am analyzing evidence I own or am explicitly authorized to examine.
          required: true
