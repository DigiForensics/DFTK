[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dftk"
version = "3.6.0"
description = "Evidence-preserving digital forensics primitives and composable workflows for analysts, automation systems, and autonomous agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "DyNooob", email = "i@digiforensics.cn"}]
maintainers = [{name = "DyNooob", email = "i@digiforensics.cn"}]
license = "Apache-2.0"
keywords = [
  "digital-forensics",
  "forensics",
  "dfir",
  "incident-response",
  "android-forensics",
  "network-forensics",
  "windows-forensics",
  "linux-forensics",
  "agent-tools",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
email = ["dkimpy>=1.1", "dnspython>=2.4", "pyspf>=2.0"]
ssh = ["paramiko>=3.4"]
yara = ["yara-python>=4.5"]
windows = ["python-registry>=1.3", "python-evtx>=0.8"]
# Disk-image / filesystem traversal (E01 + TSK). Native bindings need libewf/libtsk
# system headers; the turnkey path is `pip install 'dftk[image]'` or the Docker image.
image = ["pyewf>=0.0.20131201", "pytsk3>=20211111"]
# Windows SRUM (ESE/esedb). Fixes the dead-end `pip install 'dftk[ese]'`
# instruction that previously pointed at a non-existent extra.
ese = ["python-libesedb>=0.8"]
mcp = ["mcp>=2.0.0,<3"]
all = ["dkimpy>=1.1", "dnspython>=2.4", "pyspf>=2.0", "paramiko>=3.4", "python-registry>=1.3", "python-evtx>=0.8", "pyewf>=0.0.20131201", "pytsk3>=20211111", "python-libesedb>=0.8", "yara-python>=4.5", "mcp>=2.0.0,<3"]
dev = ["pytest>=8", "build>=1.2", "twine>=5", "mcp>=2.0.0,<3", "pytest-cov>=5"]
test = ["pytest>=8", "pytest-cov>=5"]
# Credibility-layer differential gate (P0-1): live independent oracles that
# re-derive expected values every run, so parser regressions cannot silently
# drift with a frozen constant. Install with `pip install -e '.[credibility]'`.
credibility = ["pytest>=8", "pefile>=2023.2.7", "scapy>=2.5", "dpkt>=1.9", "lief>=0.12", "regipy>=0.9"]

[project.urls]
Homepage = "https://www.digiforensics.cn"
Documentation = "https://www.digiforensics.cn"
DigiForensics = "https://www.digiforensics.cn"
LLMCN = "https://www.llmcn.org"
Blog = "https://buno.dev"
Source = "https://github.com/DigiForensics/DFTK"
Issues = "https://github.com/DigiForensics/DFTK/issues"

[project.scripts]
dftk = "dftk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dftk = [
  "data/*.txt",
]

[tool.coverage.run]
source = ["dftk"]
omit = ["*/tests/*", "dftk/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
